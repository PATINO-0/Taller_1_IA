[project]
name = "taller-1-inteligencia-artificial"
version = "1.0.0"
description = "Taller de algoritmos geneticos con FastAPI y Next.js"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard]>=0.116,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
